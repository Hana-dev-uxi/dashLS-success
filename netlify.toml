[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/staff/verify"
  to = "/.netlify/functions/staff-verify"
  status = 200

[[redirects]]
  from = "/api/apply"
  to = "/.netlify/functions/apply"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/staff/list"
  to = "/.netlify/functions/staff-list"
  status = 200

[[redirects]]
  from = "/api/staff/action"
  to = "/.netlify/functions/staff-action"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200